[project]
name = "favai"
version = "0.1.0"
description = "AI Agent Extension for Fava"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fava>=1.30.14",
    "pypdf>=5.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/theodoretsui/favai"
Repository = "https://github.com/theodoretsui/favai"
Issues = "https://github.com/theodoretsui/favai/issues"

[project.optional-dependencies]
ocr = [
    "paddleocr>=3.7.0",
    "onnxruntime>=1.26.0",
]

[project.scripts]
favai-prefetch-ocr = "favai.cli_prefetch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/favai"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]
