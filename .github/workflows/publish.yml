name: Publish to PyPI

on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/favai/

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify frontend bundle is committed
        run: git diff --exit-code -- src/favai/FavaAI.js

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Read and validate package version
        id: package
        shell: bash
        run: |
          package_version=$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=${package_version}" >> "$GITHUB_OUTPUT"
          if curl --fail --silent --show-error "https://pypi.org/pypi/favai/${package_version}/json" >/dev/null; then
            echo "favai ${package_version} already exists on PyPI; bump the version in pyproject.toml."
            exit 1
          fi

      - name: Build wheel and source distribution
        run: uv build

      - name: Check package metadata
        run: uvx twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          gh release create "v${PACKAGE_VERSION}" dist/* \
            --target "$GITHUB_SHA" \
            --title "favai v${PACKAGE_VERSION}" \
            --generate-notes
