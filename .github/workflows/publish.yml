name: Publish to PyPI

on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  check-version:
    name: Check release version change
    runs-on: ubuntu-latest
    outputs:
      should-publish: ${{ steps.check.outputs.should-publish }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check whether project version changed
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          previous_version=$(git show HEAD^:pyproject.toml | python -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["project"]["version"])')
          if [[ "$current_version" == "$previous_version" ]]; then
            echo "project.version is unchanged (${current_version}); skipping publish."
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "project.version changed: ${previous_version} -> ${current_version}"
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Build and publish
    needs: check-version
    if: needs.check-version.outputs.should-publish == 'true'
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/favai/

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Read and validate package version
        id: package
        shell: bash
        run: |
          package_version=$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=${package_version}" >> "$GITHUB_OUTPUT"
          if curl --fail --silent --show-error "https://pypi.org/pypi/favai/${package_version}/json" >/dev/null; then
            echo "favai ${package_version} already exists on PyPI; bump the version in pyproject.toml."
            exit 1
          fi

      - name: Build wheel and source distribution
        run: uv build

      - name: Verify frontend bundle is packaged
        shell: bash
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          wheel = next(Path("dist").glob("*.whl"))
          sdist = next(Path("dist").glob("*.tar.gz"))
          with zipfile.ZipFile(wheel) as archive:
              assert "favai/FavaAI.js" in archive.namelist()
          with tarfile.open(sdist) as archive:
              assert any(name.endswith("/src/favai/FavaAI.js") for name in archive.getnames())
          PY

      - name: Check package metadata
        run: uvx twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          gh release create "v${PACKAGE_VERSION}" dist/* \
            --target "$GITHUB_SHA" \
            --title "favai v${PACKAGE_VERSION}" \
            --generate-notes
