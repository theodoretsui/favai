name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test, lint, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify frontend bundle is committed
        run: git diff --exit-code -- src/favai/FavaAI.js

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Run tests
        run: make test

      - name: Run lint checks
        run: make lint

      - name: Build wheel and source distribution
        run: uv build

      - name: Check package metadata
        run: uvx twine check dist/*
